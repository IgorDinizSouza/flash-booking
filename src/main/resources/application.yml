server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: flash-booking
  config:
    # Fora do Docker, carrega o arquivo local de credenciais (ignorado se nao existir).
    # No Docker Compose as mesmas variaveis chegam por env_file.
    import: optional:file:./credencias.env[.properties]
  datasource:
    # Credenciais e conexao vem SOMENTE de credencias.env (sem senha padrao no codigo).
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
  flyway:
    enabled: true
  jackson:
    # quantity/capacity sao inteiros: 2.5, 2.0 e "2" viram 400 MALFORMED_REQUEST (sem coercao silenciosa)
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

booking:
  reservation:
    ttl: ${BOOKING_RESERVATION_TTL:10m}
    max-quantity: ${BOOKING_RESERVATION_MAX_QUANTITY:10}
    expiration-job-enabled: ${BOOKING_RESERVATION_EXPIRATION_JOB_ENABLED:true}
    expiration-job-delay: ${BOOKING_RESERVATION_EXPIRATION_JOB_DELAY:5s}
    expiration-batch-size: ${BOOKING_RESERVATION_EXPIRATION_BATCH_SIZE:100}
  availability-cache:
    enabled: ${BOOKING_AVAILABILITY_CACHE_ENABLED:true}
    ttl: ${BOOKING_AVAILABILITY_CACHE_TTL:1s}
  db:
    lock-timeout: ${BOOKING_DB_LOCK_TIMEOUT:1s}
    statement-timeout: ${BOOKING_DB_STATEMENT_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Persistencia: MyBatis com SQL explicito em XML (src/main/resources/mapper)
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # sem cache de 1o nivel entre statements: evita resultado velho dentro da mesma transacao
    # (ex.: SELECT ... FOR UPDATE / UPDATE ... RETURNING repetidos)
    local-cache-scope: statement
  type-handlers-package: com.flashbooking.infra.typehandler
