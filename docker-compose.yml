# Todas as credenciais e variaveis vem de credencias.env (copie de credencias.env.example).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: credencias.env   # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    # Acesso do host (ex.: rodar a API pelo IntelliJ). Somente localhost; 5433 evita colidir com um Postgres local na 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api1:
    build: .
    restart: unless-stopped
    # >= spring.lifecycle.timeout-per-shutdown-phase (20s): o SIGKILL do Compose (padrao 10s) nao corta o graceful shutdown
    stop_grace_period: 30s
    env_file: credencias.env
    environment: &api-env
      INSTANCE_ID: api1
      # Dentro da rede do Compose o banco e o servico "postgres" na porta 5432.
      # Sobrescreve POSTGRES_HOST/PORT do credencias.env (la ficam os valores para rodar fora do Docker, ex.: IntelliJ).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # O nginx e o healthcheck esperam as APIs na 8080 (o credencias.env usa outra porta para rodar na IDE).
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &api-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    # Debug opcional (acesso direto a instancia, sem nginx):
    # ports:
    #   - "8081:8080"

  api2:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: credencias.env
    environment:
      <<: *api-env
      INSTANCE_ID: api2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *api-health
    # Debug opcional (acesso direto a instancia, sem nginx):
    # ports:
    #   - "8082:8080"

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy

  k6:
    image: grafana/k6
    profiles: ["load"]
    environment:
      BASE_URL: http://nginx:80
    volumes:
      - ./k6:/scripts:ro
    depends_on:
      - nginx

volumes:
  pgdata:
