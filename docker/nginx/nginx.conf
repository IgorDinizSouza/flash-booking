worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Usa o X-Correlation-Id do cliente; senao gera um a partir de $request_id
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    # round-robin (padrao)
    upstream flash_booking {
        server api1:8080;
        server api2:8080;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://flash_booking;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id  $correlation_id;

            # Nunca reenviar a requisicao (ex.: POST) para outra instancia em silencio
            proxy_next_upstream off;

            proxy_connect_timeout 3s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;

            # X-Instance-Id, Retry-After, Idempotent-Replayed e Location passam sem alteracao
            # (nao ha proxy_hide_header nem proxy_redirect que os modifique).
            proxy_redirect off;
        }
    }
}
