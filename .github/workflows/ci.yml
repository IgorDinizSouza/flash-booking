name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker ja existe no runner (Testcontainers sobe o PostgreSQL 16). Os testes nao usam credencias.env.
      - name: Build and test
        run: ./mvnw -B verify
